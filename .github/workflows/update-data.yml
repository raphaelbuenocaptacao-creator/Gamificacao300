name: Atualizar Arena XP
on:
  push:
    paths:
      - 'data/base.csv'
      - 'scripts/build_data.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar data.js
        run: python scripts/build_data.py
      - name: Publicar data.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git diff --cached --quiet || git commit -m 'chore: atualizar base da Arena XP'
          git push
